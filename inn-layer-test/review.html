<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 레이어 · 모바일 비교</title><style>body{margin:0;padding:16px;background:#ddd7cc;color:#382f26;font:14px sans-serif}h1{font-size:20px}nav{display:flex;gap:20px;margin-bottom:16px}a{color:inherit}section{display:flex;gap:16px}figure{margin:0}figcaption{padding:8px}iframe{border:1px solid #b8ad9b;width:375px;height:812px;background:#eee9df}body.short iframe{width:360px;height:640px}</style><h1>같은 여관, 달라지는 흔적</h1><nav><a href="?group=states">첫 방문 / 게시판 / 큰비 + 새 의뢰</a><a href="?group=rain">비만 / 게시판 + 비 / 새 의뢰</a><a href="?group=compare">기존 C / 레이어 합성</a><a href="?group=short">360 × 640</a><a href="./">체험 화면</a></nav><section id="frames"></section><script>
