<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../"><title>이야기가 남는 여관 · C 레이어 시험</title><link rel="stylesheet" href="src/world-inn.css"><link rel="stylesheet" href="src/story.css"><link rel="stylesheet" href="inn-layer-test/style.css"></head><body><div id="app">

<p>세 사건은 독립적이야. 게시판이 없으면 새 의뢰 종이는 나타나지 않아.</p>

<details><summary>레이어·사물 표시 검사</summary><div id="layerChecks"></div><div id="objectChecks"></div><button id="restoreLayers">모두 표시</button></details>
<p><a href="inn-layer-test/assets.html">투명 자산·구성 데이터</a> · <a href="inn-style-test/">기존 A/B/C 비교판</a></p>
</div></details>
<p id="stateLabel" class="stateLabel" aria-live="polite">첫 방문 · 평상시</p>
<section id="scene" class="scene" aria-label="이야기에 따라 달라지는 여관 로비"><div id="layers" aria-hidden="true"></div><div id="hotspots"></div><img id="originalImage" src="inn-style-test/assets/lobby-c.webp" alt="레이어 분리 전의 기존 C 로비" hidden><span id="originalBadge" hidden>기존 C · 비교 중</span><div id="loading" role="status"><span id="loadingMessage">여관을 준비하는 중…</span><small id="loadingDetail" hidden></small><button id="retryLoading" hidden>다시 불러오기</button></div></section>
<section class="conversation" aria-label="현장 대화"><div class="speakerline"><span id="speaker">여관 안에서</span><button id="closeTalk" aria-label="대화 닫기" hidden>×</button></div><p id="zh" lang="zh-Hant" aria-live="polite">午後的陽光照進客棧。</p><p id="ko" hidden>오후 햇빛이 여관 안으로 들어와.</p><div id="actions"></div></section>

<main id="outsideView" class="appView outside" hidden><small>客棧門口 · 여관 문앞</small><h1>문밖으로 나왔어.</h1><p id="outsideText"></p><button id="reenter">여관으로 들어가기</button></main>
</div><dialog id="sheet" aria-label="사물 뜻"><div id="sheetContent"></div></dialog>
<script>
/* Inline so even a failed external script has a bounded, recoverable loading state. */
(function () {
  var timer;
  function fail(detail) {
    clearTimeout(timer);
    document.getElementById('loading').hidden = false;
    document.getElementById('loadingMessage').textContent = '여관을 불러오지 못했어. 다시 시도해줘.';
    var info = document.getElementById('loadingDetail');
    info.textContent = detail || '연결이 지연되고 있어.'; info.hidden = false;
    document.getElementById('retryLoading').hidden = false;
    document.getElementById('scene').dataset.ready = 'error';
  }
  window.InnLayerBoot = {fail: fail, ready: function () {
    clearTimeout(timer); document.getElementById('loading').hidden = true;
    document.getElementById('scene').dataset.ready = 'true';
  }};
  document.getElementById('retryLoading').onclick = function () {
    var url = new URL(location.href); url.searchParams.set('retry', String(Date.now())); location.replace(url.href);
  };
  window.addEventListener('error', function (event) {
    if (document.getElementById('scene').dataset.ready === 'true') return;
    var target = event.target;
    if (target && target.tagName === 'SCRIPT') fail('실행 파일: ' + target.getAttribute('src'));
    else if (event.message) fail(event.message);
  }, true);
  timer = setTimeout(function () { fail('초기화 대기 시간이 초과됐어.'); }, 25000);
})();
</script>
