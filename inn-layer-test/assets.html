<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 레이어 자산</title><style>body{max-width:1000px;margin:24px auto;padding:0 16px;background:#eee9df;color:#382f26;font:15px/1.6 sans-serif}a{color:#315941}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}figure{margin:0;padding:12px;background:#faf7ef}img{width:100%;height:240px;object-fit:contain;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/20px 20px}h1{font-size:24px}</style><h1>C · 그림을 이루는 층</h1><p><a href="./">로비 체험</a> · <a href="scene.json">구성 데이터 JSON</a> · <a href="assets/manifest.json">원본 명세</a> · <a href="assets/mobile/manifest.json">모바일 용량·변환 명세</a> · <a href="review.html">모바일 비교</a></p><p>격자는 투명 영역이야. 배경은 한 장으로 유지하고, 기물과 인물을 각각 표시해. 카운터 전경은 배경의 같은 픽셀을 마스크로 재사용해.</p><section id="gallery"></section><script>fetch('scene.json?v=5').then(r=>r.json()).then(s=>{for(const [id,a] of Object.entries(s.assets)){const f=document.createElement('figure');f.innerHTML='<img src="'+a.src+'" style="object-fit:'+(a.clipPath?'fill':'contain')+';clip-path:'+(a.clipPath||'none')+'" alt="'+id+'"><figcaption><a href="'+a.src+'">'+id+' 모바일</a> · <a href="'+a.source+'">원본</a> · '+(a.alpha?'투명 자산':'고정 배경')+'</figcaption>';document.querySelector('#gallery').append(f)}})</script></html>
