<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>出發 — 단어 전술게임 튜토리얼</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div id="app"><main class="shell" aria-live="polite">
<div class="topbar"><button class="iconbtn" id="menuBtn" aria-label="스테이지 메뉴">☰</button><div class="stagehead"><div class="stagekicker" id="stageKicker"></div><div class="stagetitle" id="stageTitle"></div></div><button class="iconbtn" id="resetBtn" aria-label="현재 스테이지 다시 시작">↻</button></div>
<section class="goalbox"><div class="goal" id="goal"></div><div class="ruleline" id="ruleLine"></div></section>
<section class="mapwrap"><div class="grid" id="grid" role="grid" aria-label="전술 지도"></div></section>
<div class="status" id="status">용사를 눌러 시작해봐.</div>
<div class="words" id="words"></div>
<div class="controls"><button class="control" id="waitBtn" aria-label="제자리에서 한 턴 기다리기" title="용사는 움직이지 않고, 늑대의 순찰만 한 턴 진행해.">1턴 기다리기</button><button class="control" id="inspectBtn">살펴보기</button><button class="control" id="undoBtn">되돌리기</button></div>
</main></div>
<div class="scrim" id="scrim"><section class="sheet" id="sheet" role="dialog" aria-modal="true"></section></div>
<script src="./src/app.js"></script>
</body>
</html>
