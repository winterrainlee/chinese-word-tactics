<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>出發 — 단어 전술게임</title>
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/range-runtime.css">
<link rel="stylesheet" href="./src/route-runtime.css">
<link rel="stylesheet" href="./src/world.css">
<link rel="stylesheet" href="./src/view.css">
<link rel="stylesheet" href="./src/icons-runtime.css">
<link rel="stylesheet" href="./src/story.css">
<link rel="stylesheet" href="./src/journey.css">
</head>
<body>
<div id="flowNotice" class="flowNotice" role="status" hidden></div>
<div id="app">
  <main id="tutorialView" class="shell appView" aria-live="polite">
    <div class="topbar"><button class="iconbtn" id="menuBtn" aria-label="게임 메뉴">☰</button><div class="stagehead"><div class="stagekicker" id="stageKicker"></div><div class="stagetitle" id="stageTitle"></div></div><button class="iconbtn" id="resetBtn" aria-label="현재 스테이지 다시 시작">↻</button></div>
    <section class="goalbox"><div class="goal" id="goal"></div><div class="ruleline" id="ruleLine"></div></section>
    <section class="mapwrap"><div class="grid" id="grid" role="grid" aria-label="전술 지도"></div></section>
    <div class="status" id="status">소년을 눌러 시작해봐.</div>
    <div class="words" id="words"></div>
    <div class="controls"><button class="control" id="waitBtn" aria-label="제자리에서 한 턴 기다리기" title="소년은 움직이지 않고, 늑대의 순찰만 한 턴 진행해.">1턴 기다리기</button><button class="control" id="inspectBtn">살펴보기</button><button class="control" id="undoBtn">되돌리기</button></div>
  </main>

  <main id="worldView" class="worldShell appView" hidden aria-live="polite">
    <div class="worldTopbar">
      <button class="iconbtn" id="worldBackBtn" aria-label="여정으로">←</button>
      <div class="worldHeading"><div class="stagekicker">프롤로그 이후</div><h1>어디로 갈까?</h1></div>
      <div class="worldCompass" aria-hidden="true">⌖</div>
    </div>

    <section class="worldOrigin" aria-label="현재 위치 고향 마을, 出發">
      <span class="worldOriginLabel">현재 위치</span>
      <div class="worldOriginHead">
        <img class="worldOriginIcon" src="./icons/world/regions/region-origin.svg" alt="" aria-hidden="true">
        <span class="worldOriginNames">
          <strong>고향 마을</strong>
          <small class="worldOriginZh">出發</small>
        </span>
      </div>
      <small>숲을 빠져나오자 세 갈래 길이 보인다.</small>
    </section>

    <section id="worldRegions" class="worldRegions" aria-label="첫 월드 지역"></section>
    <div id="worldHint" class="worldHint"></div>
    <button id="worldContinue" class="journeyContinue">이어서 여행하기</button>
    <nav class="flowNav" aria-label="주요 메뉴"><button data-flow="world" aria-current="page">월드맵</button><button data-flow="journey">여정</button><button data-flow="words">단어장</button></nav>
  </main>
  <main id="storyView" class="storyShell appView" hidden aria-label="이야기">
    <header class="storyTopbar"><button id="storyMenu" class="iconbtn" aria-label="게임 메뉴">☰</button><h1 id="storyTitle"></h1><span id="storyCount" class="storyCount"></span></header>
    <div id="storyScene" class="storyScene"><img id="storyBackdrop" class="storyBackdrop" alt="" aria-hidden="true"><span id="storyPlace" class="storyPlace"></span></div>
    <section id="storyReading" class="storyReading" aria-label="현재 대사" tabindex="0">
      <div class="storySpeakerRow"><img id="storyPortrait" class="storyPortrait" src="./icons/world/world-hero.svg" alt="" aria-hidden="true"><span id="storySpeaker" class="storySpeaker" lang="zh-Hant"></span></div>
      <p id="storyZh" class="storyZh" lang="zh-Hant" aria-live="polite"></p>
      <button id="storyTranslate" class="storyTranslate" aria-controls="storyKo" aria-expanded="false">한국어 뜻 보기</button>
      <p id="storyKo" class="storyKo" lang="ko" hidden></p>
    </section>
    <div class="storyActions"><button id="storyPrev">이전</button><button id="storyNext">다음</button></div>
    <button id="storySkip" class="storySkip" hidden>장면 건너뛰기</button>
  </main>
  <main id="journeyView" class="journeyShell appView" hidden>
    <header class="journeyHeader"><div class="stagekicker">걸어온 길, 앞으로의 이야기</div><h1>여정</h1><p id="journeySummary"></p></header>
    <button id="journeyContinue" class="journeyContinue">이어서 여행하기</button>
    <p class="flowNote">본편은 이어서 여행하기로 진행해. 판을 다시 연습해도 본편 위치는 바뀌지 않아.</p>
    <div class="journeyFilters" role="group" aria-label="여정 필터"><button data-journey-filter="all" aria-pressed="true">전체</button><button data-journey-filter="story" aria-pressed="false">이야기</button><button data-journey-filter="stage" aria-pressed="false">스테이지</button></div>
    <div id="journeyList"></div>
    <nav class="flowNav" aria-label="주요 메뉴"><button data-flow="world">월드맵</button><button data-flow="journey" aria-current="page">여정</button><button data-flow="words">단어장</button></nav>
  </main>
</div>
<div class="scrim" id="scrim"><section class="sheet" id="sheet" role="dialog" aria-modal="true"></section></div>
<script src="./src/content.js"></script>
<script src="./src/journey-content.js"></script>
<script src="./src/journey-progress.js"></script>
<script src="./src/story-outcome-content.js"></script>
<script src="./src/story-runtime.js"></script>
<script src="./src/journey-runtime.js"></script>
<script src="./src/app.js"></script>
<script src="./src/interaction-runtime.js"></script>
<script src="./src/range-runtime.js"></script>
<script src="./src/route-runtime.js"></script>
<script src="./src/flow-runtime.js"></script>
<script src="./src/icons-runtime.js"></script>
<script src="./src/world-runtime.js"></script>
</body>
</html>
