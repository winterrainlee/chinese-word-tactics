<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>出發 — 단어 전술게임</title>
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/world.css">
<link rel="stylesheet" href="./src/view.css">
<link rel="stylesheet" href="./src/icons-runtime.css">
</head>
<body>
<div id="app">
  <main id="tutorialView" class="shell appView" aria-live="polite">
    <div class="topbar"><button class="iconbtn" id="menuBtn" aria-label="스테이지 메뉴">☰</button><div class="stagehead"><div class="stagekicker" id="stageKicker"></div><div class="stagetitle" id="stageTitle"></div></div><button class="iconbtn" id="resetBtn" aria-label="현재 스테이지 다시 시작">↻</button></div>
    <section class="goalbox"><div class="goal" id="goal"></div><div class="ruleline" id="ruleLine"></div></section>
    <section class="mapwrap"><div class="grid" id="grid" role="grid" aria-label="전술 지도"></div></section>
    <div class="status" id="status">용사를 눌러 시작해봐.</div>
    <div class="words" id="words"></div>
    <div class="controls"><button class="control" id="waitBtn" aria-label="제자리에서 한 턴 기다리기" title="용사는 움직이지 않고, 늑대의 순찰만 한 턴 진행해.">1턴 기다리기</button><button class="control" id="inspectBtn">살펴보기</button><button class="control" id="undoBtn">되돌리기</button></div>
  </main>

  <main id="worldView" class="worldShell appView" hidden aria-live="polite">
    <div class="worldTopbar">
      <button class="iconbtn" id="worldBackBtn" aria-label="튜토리얼로 돌아가기">←</button>
      <div class="worldHeading"><div class="stagekicker">출발 마을 이후</div><h1>어디로 갈까?</h1></div>
      <div class="worldCompass" aria-hidden="true">⌖</div>
    </div>

    <section class="worldOrigin" aria-label="현재 위치 출발 마을, 出發">
      <span class="worldOriginLabel">현재 위치</span>
      <div class="worldOriginHead">
        <img class="worldOriginIcon" src="./icons/world/regions/region-origin.svg" alt="" aria-hidden="true">
        <span class="worldOriginNames">
          <strong>출발 마을</strong>
          <small class="worldOriginZh">出發</small>
        </span>
      </div>
      <small>숲을 빠져나오자 세 갈래 길이 보인다.</small>
    </section>

    <section id="worldRegions" class="worldRegions" aria-label="첫 월드 지역"></section>
    <div id="worldHint" class="worldHint"></div>
  </main>
</div>
<div class="scrim" id="scrim"><section class="sheet" id="sheet" role="dialog" aria-modal="true"></section></div>
<script src="./src/content.js"></script>
<script src="./src/app.js"></script>
<script src="./src/icons-runtime.js"></script>
<script src="./src/world-runtime.js"></script>
</body>
</html>
