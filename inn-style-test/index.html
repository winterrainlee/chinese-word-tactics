<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../"><title>여관의 세 가지 모습 · 따라온 단어들</title><link rel="stylesheet" href="src/world-inn.css"><link rel="stylesheet" href="src/story.css"><link rel="stylesheet" href="inn-style-test/style.css"></head>
<body><div id="app">
<main id="lobbyView" class="appView">
<header class="heading"><div><small>따라온 단어들 · 미술 비교실</small><h1>돌아오는 곳, 여관 <span lang="zh-Hant">客棧</span></h1></div><button id="hint" aria-pressed="false">위치 보기</button></header>
<nav class="styles" aria-label="로비 화풍"><button data-style="a" aria-pressed="true"><b>A</b> 회화적 삽화</button><button data-style="b" aria-pressed="false"><b>B</b> 고전 픽셀</button><button data-style="c" aria-pressed="false"><b>C</b> 그림책 레트로</button></nav>
<section id="scene" class="scene" aria-label="여관 로비"><img id="backdrop" src="inn-style-test/assets/lobby-a.webp" alt="카운터와 여관 주인, 벽의 게시판, 오른쪽 계단, 식탁과 출입문이 있는 로비"><div id="hotspots"></div><p id="imageError" hidden>그림을 불러오지 못했어. 화풍을 다시 선택해줘.</p></section>
<section id="conversation" class="conversation" aria-label="로비 대화와 조사"><div class="speakerline"><span id="speaker">여관 안에서</span><button id="closeTalk" hidden aria-label="대화 닫기">×</button></div><p id="zh" lang="zh-Hant">햇빛이 식탁 위에 머물고 있어.</p><p id="ko" hidden></p><div id="actions" class="actions"></div></section>
<footer><span id="styleName">A · 회화적 삽화</span><button id="focusStory">집중형 이야기 보기</button><p>별도 화풍 시험판 · 본편 진행은 저장하지 않아.</p></footer>
</main>
<main id="storyView" class="storyShell appView" hidden aria-label="이야기"><header class="storyTopbar"><span id="storyCount" class="storyCount"></span><h1 id="storyTitle"></h1><button id="storyMenu" class="iconbtn" type="button" aria-label="로비로 돌아가기">×</button></header><div id="storyScene" class="storyScene"><img id="storyBackdrop" class="storyBackdrop" alt="" aria-hidden="true"><span id="storyPlace" class="storyPlace"></span></div><section id="storyReading" class="storyReading" aria-label="현재 대사" tabindex="0"><div class="storySpeakerRow"><img id="storyPortrait" class="storyPortrait" alt="" aria-hidden="true"><span id="storySpeaker" class="storySpeaker" lang="zh-Hant"></span></div><p id="storyZh" class="storyZh" lang="zh-Hant" aria-live="polite"></p><button id="storyTranslate" class="storyTranslate" aria-controls="storyKo" aria-expanded="false">한국어 뜻 보기</button><p id="storyKo" class="storyKo" lang="ko" hidden></p></section><div class="storyActions"><button id="storyPrev">이전</button><button id="storyNext">다음</button></div><button id="storySkip" class="storySkip" hidden>장면 건너뛰기</button></main>
</div><dialog id="sheet" aria-label="사물 뜻"><div id="sheetContent"></div></dialog>
<script src="inn-style-test/content.js"></script><script src="inn-style-test/app.js"></script><script src="src/world-inn-runtime.js"></script><script src="src/story-runtime.js"></script></body></html>
