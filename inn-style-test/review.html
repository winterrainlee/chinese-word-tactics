<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>375 × 812 · 여관 화풍 비교</title><style>body{margin:0;background:#dcd7cd;font-family:sans-serif;color:#352f29}header{padding:12px 20px;font-size:16px}main{display:flex;gap:12px;padding:0 12px 12px;width:max-content}iframe{width:375px;height:812px;border:0;background:#eee9df}label{font-size:12px;margin-left:20px}select{min-height:44px}p{font-size:12px;margin:0 20px 12px}</style></head><body><header>동일 배치 · 동일 대사 · 동일 조작<label>화면 크기 <select id="size"><option value="375,812">375 × 812</option><option value="375,640">375 × 640</option><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option></select></label></header><p>브라우저 안의 고정 크기 뷰포트 비교야. 실제 iPhone Safari 검수와는 별개야.</p><main><iframe id="a" title="A 회화적 삽화" src="./?style=a"></iframe><iframe id="b" title="B 고전 픽셀 RPG" src="./?style=b"></iframe><iframe id="c" title="C 그림책형 레트로 RPG" src="./?style=c"></iframe></main><script>document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');document.querySelectorAll('iframe').forEach(f=>{f.style.width=w+'px';f.style.height=h+'px';});};</script></body></html>
