name: Chapter 2 P1 first-sighting tests
on:
  push:
    branches: [feature/chapter2-p1-first-sightings-20261102]
  pull_request:
    branches: [main]
    paths:
      - 'src/chapter2-rain-content.js'
      - 'src/chapter2-first-look-runtime.js'
      - 'src/world-runtime.js'
      - 'src/journey-progress.js'
      - 'tests/chapter2-p1-first-sightings.test.cjs'
      - 'tests/smoke_chapter2_p1.py'
      - 'index.html'
permissions:
  contents: read
jobs:
  p1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/chapter2-first-look-runtime.js
      - run: node --test tests/chapter2-p1-first-sightings.test.cjs tests/chapter2-rain.test.cjs
      - run: node tools/verify-content.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python tests/smoke_chapter2_p1.py
