name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Run unit tests
        run: node --test tests/*.test.cjs

      - name: Run UX heuristic audit
        run: node tools/ux-audit.cjs

      - name: Run status language audit
        run: node tools/status-language-audit.cjs

      - name: Run story handoff audit
        run: node tools/story-handoff-audit.cjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run mobile UX browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_ux.py

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: ${{ runner.temp }}/ux-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4