name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript
        run: |
          for file in src/*.js; do
            node --check "$file"
          done
          node --check world-grid-test/app.js
          for file in inn-layer-test/*.js; do node --check "$file"; done

      - name: Run unit tests
        run: node --test tests/*.test.cjs

      - name: Run content contract audit
        run: node tools/content-contract-audit.cjs

      - name: Run vocabulary lifecycle audit
        run: node tools/vocabulary-lifecycle-audit.cjs

      - name: Run UX heuristic audit
        run: node tools/ux-audit.cjs

      - name: Run status language audit
        run: node tools/status-language-audit.cjs

      - name: Run story handoff audit
        run: node tools/story-handoff-audit.cjs

      - name: Run story pronunciation audit
        run: node tools/story-pronunciation-audit.cjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit

      - name: Run mobile UX browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_ux.py

      - name: Run design action contract browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: |
          python tests/smoke_design_actions.py
          python tests/smoke_design_boundaries.py

      - name: Run settings backup browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_settings.py

      - name: Run gate tactical browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_gate_tactical.py

      - name: Run inn room browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_inn.py

      - name: Run isolated inn layers mobile smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: |
          python tests/smoke_inn_layers.py
          BROWSER=webkit python tests/smoke_inn_layers.py

      - name: Run world spatial grid G1 browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_world_grid.py

      - name: Verify G3 shared world/story/quest context
        run: python tests/smoke_world_spatial_g3.py

      - name: Run Chapter 2 rain introductory story browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_chapter2_rain.py

      - name: Run Chapter 2 P1 optional first-sighting browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_chapter2_p1.py

      - name: Run C08 first free quest browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_first_free_quest.py

      - name: Run northern forest F2-F8 browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_north_forest.py

      - name: Run Academic Tower branching/unlock mobile smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_tower_unlock_conditions.py

      - name: Run Academic Tower Slice A browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_academic_tower.py
      - name: Academic Tower workbench and optional research
        run: |
          python tests/smoke_academic_tower_mvp.py
          python tests/smoke_academic_tower_ran.py
          python tests/smoke_academic_tower_ran_village.py

      - name: 04A fieldwork mobile and persistence smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_academic_tower_er_04a.py

      - name: Run tactical layout viewport matrix
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: |
          python tests/smoke_gate_layout.py
          python tests/smoke_workshop_layout.py
          python tests/smoke_market_layout.py
          python tests/smoke_north_forest_layout.py
          python tests/smoke_academic_tower_layout.py

      - name: Run mobile lexicon browser smoke
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python tests/smoke_lexicon.py

      - name: Run journey browser regression
        env:
          TEST_OUTPUT: ${{ runner.temp }}/journey-screenshots
        run: |
          python tests/smoke_return_context.py
          python tests/smoke_journey_numbering.py
          python tests/smoke_journey.py

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: ${{ runner.temp }}/ux-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots
          path: ${{ runner.temp }}/journey-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify isolated inn integration test
        env:
          TEST_OUTPUT: ${{ runner.temp }}/ux-screenshots
        run: python inn-integration-test/verify.py

      - name: Verify isolated inn interaction test
        env:
          TEST_OUTPUT: ${{ runner.temp }}/inn-interaction-evidence
        run: python inn-interaction-test/verify.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published inn version and assets
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}inn-integration-test/
        run: |
          python - <<'PYCODE'
          import os,json,hashlib,time,urllib.request,concurrent.futures
          from pathlib import Path
          base=os.environ['BASE_URL']
          expected=json.loads(Path('inn-integration-test/manifest.json').read_text())
          def read(path):
              with urllib.request.urlopen(base+path,timeout=30) as r:return r.read()
          for attempt in range(12):
              live=json.loads(read('version.json'))
              if live['sourceCommit']==expected['sourceCommit']:break
              time.sleep(5)
          assert live['sourceCommit']==expected['sourceCommit'],live
          def verify(item):
              path,digest=item
              assert hashlib.sha256(read(path)).hexdigest()==digest,path
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(verify,expected['files'].items()))
          print('PASS: published source',live['sourceCommit'],'and',len(expected['files']),'file hashes')
          PYCODE

      - name: Verify public inn on Chromium and WebKit
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}inn-integration-test/
          TEST_OUTPUT: ${{ runner.temp }}/inn-public-evidence
        run: python inn-integration-test/verify.py

      - name: Upload public inn evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inn-public-evidence
          path: ${{ runner.temp }}/inn-public-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify published inn interaction version and assets
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}inn-interaction-test/
        run: |
          python - <<'PYCODE'
          import os,json,hashlib,time,urllib.request,concurrent.futures
          from pathlib import Path
          base=os.environ['BASE_URL']
          expected=json.loads(Path('inn-interaction-test/manifest.json').read_text())
          def read(path):
              with urllib.request.urlopen(base+path,timeout=30) as r:return r.read()
          for attempt in range(12):
              live=json.loads(read('version.json'))
              if live['sourceCommit']==expected['sourceCommit']:break
              time.sleep(5)
          assert live['sourceCommit']==expected['sourceCommit'],live
          def verify(item):
              path,digest=item
              assert hashlib.sha256(read(path)).hexdigest()==digest,path
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(verify,expected['files'].items()))
          print('PASS: published source',live['sourceCommit'],'and',len(expected['files']),'file hashes')
          PYCODE

      - name: Verify public inn interaction on Chromium and WebKit
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}inn-interaction-test/
          TEST_OUTPUT: ${{ runner.temp }}/inn-interaction-public-evidence
        run: python inn-interaction-test/verify.py

      - name: Upload public inn interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inn-interaction-public-evidence
          path: ${{ runner.temp }}/inn-interaction-public-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify approved exploration UI on public main
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/smoke_inn_public.py
