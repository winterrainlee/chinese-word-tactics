name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript
        run: |
          node --check src/content.js
          node --check src/g7-content.js
          node --check src/journey-content.js
          node --check src/g7-journey-content.js
          node --check src/world-v06-content.js
          node --check src/journey-progress.js
          node --check src/story-outcome-content.js
          node --check src/g7-story-outcome-content.js
          node --check src/gate-reward-story-content.js
          node --check src/app.js
          node --check src/interaction-runtime.js
          node --check src/range-runtime.js
          node --check src/route-runtime.js
          node --check src/g4-runtime.js
          node --check src/movable-entity-runtime.js
          node --check src/follower-runtime.js
          node --check src/g7-runtime.js
          node --check src/follower-chain-runtime.js
          node --check src/flow-runtime.js
          node --check src/icons-runtime.js
          node --check src/world-runtime.js
          node --check src/world-reward-runtime.js

      - name: Run unit tests
        run: node --test tests/*.test.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
